name: CD Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-producao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    name: Digest em homologação
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      imagem: ${{ steps.resolver.outputs.imagem }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      SERVICE: oficina-auth
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolver o digest da revisão no ar
        id: resolver
        run: |
          set -euo pipefail

          EM_USO=$(gcloud run services describe "$SERVICE" \
            --project="$PROJECT" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].image)')

          REPO="${REGION}-docker.pkg.dev/${PROJECT}/oficina-auth/${SERVICE}"

          case "$EM_USO" in
            "$REPO":* | "$REPO"@*) ;;
            "") echo "::error::nao foi possivel ler a imagem do servico $SERVICE em homologacao"; exit 1 ;;
            *) echo "::error::homologacao esta servindo '$EM_USO', que nao e imagem de $REPO"; exit 1 ;;
          esac

          case "$EM_USO" in
            *@sha256:*)
              DIGEST="${EM_USO##*@}"
              ;;
            *)
              DIGEST=$(gcloud artifacts docker images describe "$EM_USO" \
                --format='value(image_summary.digest)')
              ;;
          esac

          if [ -z "$DIGEST" ]; then
            echo "::error::nao foi possivel resolver o digest de $EM_USO"
            exit 1
          fi

          echo "imagem=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### Promoção"
            echo "- Em homologação: \`$EM_USO\`"
            echo "- Digest promovido: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy em produção
    needs: digest
    runs-on: ubuntu-latest
    environment: production
    outputs:
      issuer: ${{ steps.entregar.outputs.issuer }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      SERVICE: oficina-auth
      IMAGEM: ${{ needs.digest.outputs.imagem }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy no Cloud Run
        id: entregar
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="$IMAGEM" \
            --no-allow-unauthenticated \
            --service-account="auth-fn@${PROJECT}.iam.gserviceaccount.com" \
            --vpc-connector=auth-connector \
            --vpc-egress=private-ranges-only \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=15s \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=5 \
            --set-env-vars="ISSUER=${{ vars.AUTH_ISSUER }},AUDIENCE=oficina,TOKEN_TTL_SECONDS=3600,DB_URL=${{ vars.DB_URL }},DB_USER=auth_ro" \
            --set-secrets="JWT_PRIVATE_KEY=jwt-signing-key:latest,DB_PASSWORD=db-auth-password:latest"
          echo "issuer=${{ vars.AUTH_ISSUER }}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ISSUER: ${{ needs.deploy.outputs.issuer }}
    steps:
      - name: JWKS publica ao menos uma chave
        run: curl -fsS "$ISSUER/.well-known/jwks.json" | jq -e '.keys | length > 0'

      - name: CPF inválido devolve 400
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"cpf":"000"}' \
            "$ISSUER/auth/token")
          test "$STATUS" = "400"
