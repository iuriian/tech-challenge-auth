name: Terraform - CD

# release/** -> homologação (Environment "staging")
# main       -> produção    (Environment "production")
on:
  push:
    branches: [main, "release/**"]
    paths: ["terraform/**", ".github/workflows/terraform-cd.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente (production só a partir da main)"
        type: choice
        options: [staging, production]
        default: staging

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.environment }}
        run: |
          if [ -n "$INPUT" ]; then
            ENVIRONMENT="$INPUT"
          elif [ "$REF" = "refs/heads/main" ]; then
            ENVIRONMENT=production
          else
            ENVIRONMENT=staging
          fi

          if [ "$ENVIRONMENT" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Produção só pode ser aplicada a partir da main (ref atual: $REF)"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Ambiente: **$ENVIRONMENT** ($REF)" >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: resolve
    name: Apply (${{ needs.resolve.outputs.environment }})
    runs-on: ubuntu-latest
    # Configure "Required reviewers" no Environment production para aprovar o apply
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: terraform-auth-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Check environment config
        run: |
          TFVARS="environments/${ENVIRONMENT}.tfvars"
          case "$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' "$TFVARS")" in
            ""|PREENCHER*) echo "::error::Preencha project_id em $TFVARS"; exit 1 ;;
          esac

      - name: Init
        run: terraform init -input=false -backend-config="environments/${ENVIRONMENT}.gcs.tfbackend"

      - name: Plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode \
            -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan 2>&1 | tee plan.txt
          CODE=${PIPESTATUS[0]}
          set -e
          # -detailed-exitcode: 0 = sem mudanças, 2 = com mudanças, resto = erro
          case "$CODE" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$CODE" ;;
          esac
          {
            echo "## Terraform plan ($ENVIRONMENT)"
            echo '```'
            grep -E '^(Plan:|No changes|  [#~+-])' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -input=false -lock-timeout=5m tfplan

      # Sempre, não só depois de um apply: o issuer é o que a app precisa na
      # variable AUTH_ISSUER_URI, e quem roda o workflow vem buscá-lo aqui.
      - name: Outputs
        if: success()
        run: |
          {
            echo "## Endereços ($ENVIRONMENT)"
            echo "| Output | Valor |"
            echo "| --- | --- |"
            terraform output -json | jq -r '
              to_entries[]
              | select(.key | IN("issuer", "service_url", "db_url", "image_repo"))
              | "| \(.key) | `\(.value.value)` |"'
          } >> "$GITHUB_STEP_SUMMARY"
