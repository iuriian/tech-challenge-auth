name: CD Homologação

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: cd-homologacao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  imagem:
    name: Imagem (build e push)
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ref: ${{ steps.publicar.outputs.ref }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      SERVICE: oficina-auth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: imagem-context
          path: build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar no Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build e push da imagem
        id: publicar
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT}/oficina-auth/${SERVICE}"
          docker build -t "${REPO}:${GITHUB_SHA}" -t "${REPO}:latest" .
          docker push "${REPO}:${GITHUB_SHA}"
          docker push "${REPO}:latest"
          echo "ref=${REPO}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy em homologação
    needs: imagem
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      issuer: ${{ steps.entregar.outputs.issuer }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      SERVICE: oficina-auth
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy no Cloud Run
        id: entregar
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --image="${{ needs.imagem.outputs.ref }}" \
            --no-allow-unauthenticated \
            --service-account="auth-fn@${PROJECT}.iam.gserviceaccount.com" \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=15s \
            --concurrency=8 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="ISSUER=${{ vars.AUTH_ISSUER }},AUDIENCE=oficina,TOKEN_TTL_SECONDS=3600,DB_URL=${{ vars.DB_URL }},DB_USER=auth_ro" \
            --set-secrets="JWT_PRIVATE_KEY=jwt-signing-key:latest,DB_PASSWORD=db-auth-password:latest"
          echo "issuer=${{ vars.AUTH_ISSUER }}" >> "$GITHUB_OUTPUT"

  smoke-test:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ISSUER: ${{ needs.deploy.outputs.issuer }}
    steps:
      - name: JWKS publica ao menos uma chave
        run: curl -fsS "$ISSUER/.well-known/jwks.json" | jq -e '.keys | length > 0'

      - name: CPF inválido devolve 400
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"cpf":"000"}' \
            "$ISSUER/auth/token")
          test "$STATUS" = "400"
